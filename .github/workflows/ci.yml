name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Unit tests
        run: go test -count=1 ./...

      # testcontainers-go starts Postgres with the runner's Docker daemon.
      - name: Integration tests
        run: go test -tags integration -count=1 -v ./test/integration/...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Unit tests with -race
        run: go test -race -count=1 ./...

      - name: Integration tests with -race
        run: go test -race -tags integration -count=1 ./test/integration/...
